name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: shellcheck ./*.sh
      - name: Check Python and unit tests
        run: |
          python -m compileall -q acceptance_test.py tests
          python -m unittest discover -s tests -v
      - name: Parse PowerShell script
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw ./proxy_watch.ps1))
